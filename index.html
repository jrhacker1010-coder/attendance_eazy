<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Attendance Message Generator</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: linear-gradient(135deg, #667eea, #764ba2);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .app {
      width: 100%;
      max-width: 900px;
      background: #ffffff;
      border-radius: 16px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.2);
      overflow: hidden;
    }

    .header {
      background: #4f46e5;
      color: white;
      padding: 25px;
      text-align: center;
    }

    .content {
      padding: 30px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 25px;
    }

    .card {
      background: #f9fafb;
      border-radius: 12px;
      padding: 20px;
      border: 1px solid #e5e7eb;
    }

    label {
      font-size: 14px;
      margin-bottom: 6px;
      display: block;
    }

    input, textarea {
      width: 100%;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #d1d5db;
      margin-bottom: 12px;
      font-size: 14px;
    }

    button {
      padding: 12px;
      border-radius: 10px;
      border: none;
      background: #4f46e5;
      color: white;
      font-size: 15px;
      cursor: pointer;
      margin-top: 8px;
    }

    button:hover {
      background: #4338ca;
    }

    textarea {
      height: 220px;
      resize: none;
    }

    .full {
      grid-column: 1 / -1;
    }

    pre {
      background: #111827;
      color: white;
      padding: 12px;
      border-radius: 8px;
      font-size: 13px;
    }

    @media (max-width: 768px) {
      .content {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

<div class="app">
  <div class="header">
    <h1>Attendance Message Generator</h1>
    <p>Upload CSV • Enter roll numbers • Copy or download message</p>
  </div>

  <div class="content">

    <div class="card">
      <h3>CSV Format</h3>
      <pre>RollNo,Name
1,Arya
2,Ravi
3,Sita
4,Kumar</pre>

      <label>Upload CSV File</label>
      <input type="file" id="csvFile" accept=".csv">
    </div>

    <div class="card">
      <h3>Attendance Details</h3>

      <label>Select Date</label>
      <input type="date" id="dateInput">

      <label>Absent Roll Numbers</label>
      <input type="text" id="absentRolls" placeholder="e.g. 1,4">

      <label>OD Roll Numbers</label>
      <input type="text" id="odRolls" placeholder="e.g. 2">
    </div>

    <div class="card full">
      <button onclick="generateMessage()">Generate Attendance Message</button>
    </div>

    <div class="card full">
      <h3>Generated Message</h3>
      <textarea id="output" readonly></textarea>

      <button onclick="copyText()">Copy Text</button>
      <button onclick="downloadText()">Download Text</button>
    </div>

  </div>
</div>

<script>
  let students = {};

  function generateMessage() {
    const file = document.getElementById('csvFile').files[0];
    const date = document.getElementById('dateInput').value;
    const absentRolls = document.getElementById('absentRolls').value.split(',').map(r => r.trim());
    const odRolls = document.getElementById('odRolls').value.split(',').map(r => r.trim());
    const output = document.getElementById('output');

    if (!file) {
      alert("Please upload CSV file");
      return;
    }

    const reader = new FileReader();
    reader.onload = function(e) {
      const lines = e.target.result.split('\n');
      students = {};

      for (let i = 1; i < lines.length; i++) {
        const row = lines[i].split(',');
        if (row.length >= 2) {
          students[row[0].trim()] = row[1].trim();
        }
      }

      const absentees = absentRolls.filter(r => students[r]).map(r => students[r]);
      const ods = odRolls.filter(r => students[r]).map(r => students[r]);

      let text = "GOOD MORNING\n\n";
      text += "Date: " + date + "\n\n";
      text += "Absentees:\n" + (absentees.length ? absentees.join('\n') : "None") + "\n\n";
      text += "OD Students:\n" + (ods.length ? ods.join('\n') : "None");

      output.value = text;
    };

    reader.readAsText(file);
  }

  function copyText() {
    const output = document.getElementById('output');
    if (!output.value) {
      alert("Nothing to copy");
      return;
    }
    output.select();
    document.execCommand("copy");
    alert("Copied to clipboard");
  }

  function downloadText() {
    const text = document.getElementById('output').value;
    if (!text) return;

    const blob = new Blob([text], { type: "text/plain" });
    const link = document.createElement("a");
    link.href = URL.createObjectURL(blob);
    link.download = "attendance_message.txt";
    link.click();
  }
</script>

</body>
</html>
