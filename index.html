<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Attendance Message Generator</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: linear-gradient(135deg, #667eea, #764ba2);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .app {
      width: 100%;
      max-width: 900px;
      background: #ffffff;
      border-radius: 16px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.2);
      overflow: hidden;
    }

    .header {
      background: #4f46e5;
      color: white;
      padding: 25px;
      text-align: center;
    }

    .header h1 {
      margin: 0;
      font-weight: 600;
    }

    .header p {
      margin-top: 8px;
      opacity: 0.9;
      font-size: 14px;
    }

    .content {
      padding: 30px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 25px;
    }

    .card {
      background: #f9fafb;
      border-radius: 12px;
      padding: 20px;
      border: 1px solid #e5e7eb;
    }

    .card h3 {
      margin-top: 0;
      margin-bottom: 15px;
      font-size: 18px;
      color: #111827;
    }

    label {
      display: block;
      font-size: 14px;
      margin-bottom: 6px;
      color: #374151;
    }

    input[type="date"],
    input[type="file"],
    input[type="text"] {
      width: 100%;
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px solid #d1d5db;
      margin-bottom: 12px;
      font-size: 14px;
    }

    .hint {
      font-size: 12px;
      color: #6b7280;
      margin-bottom: 10px;
    }

    button {
      width: 100%;
      padding: 12px;
      border-radius: 10px;
      border: none;
      background: #4f46e5;
      color: white;
      font-size: 15px;
      font-weight: 500;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 20px rgba(79,70,229,0.4);
    }

    textarea {
      width: 100%;
      height: 220px;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid #d1d5db;
      resize: none;
      font-size: 14px;
      background: #ffffff;
    }

    .full {
      grid-column: 1 / -1;
    }

    pre {
      background: #111827;
      color: #f9fafb;
      padding: 12px;
      border-radius: 8px;
      font-size: 13px;
      overflow-x: auto;
    }

    @media (max-width: 768px) {
      .content {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>

  <div class="app">
    <div class="header">
      <h1>Attendance Message Generator</h1>
      <p>Upload class list • Enter roll numbers • Download formatted message</p>
    </div>

    <div class="content">

      <div class="card">
        <h3>Class List (CSV)</h3>
        <pre>RollNo,Name
1,Arya
2,Ravi
3,Sita
4,Kumar</pre>
        <label>Upload CSV File</label>
        <input type="file" id="csvFile" accept=".csv">
      </div>

      <div class="card">
        <h3>Date & Leave Details</h3>
        <label>Select Date</label>
        <input type="date" id="dateInput">

        <label>Absent Roll Numbers</label>
        <input type="text" id="absentRolls" placeholder="e.g. 1,4,7">
        <div class="hint">Comma separated roll numbers</div>

        <label>OD Roll Numbers</label>
        <input type="text" id="odRolls" placeholder="e.g. 2,5">
        <div class="hint">Comma separated roll numbers</div>
      </div>

      <div class="card full">
        <button onclick="generateMessage()">Generate Attendance Message</button>
      </div>

      <div class="card full">
        <h3>Generated Output</h3>
        <textarea id="output" readonly></textarea>
        <br><br>
        <button onclick="copyText()">Copy Text</button>
        <br><br>
        <button onclick="downloadText()">Download Message</button>
      </div>

    </div>
  </div>

<script>
  function generateMessage() {
    const file = document.getElementById('csvFile').files[0];
    const date = document.getElementById('dateInput').value;
    const absentRolls = document.getElementById('absentRolls').value.split(',').map(r => r.trim());
    const odRolls = document.getElementById('odRolls').value.split(',').map(r => r.trim());
    const output = document.getElementById('output');

    if (!file) {
      alert('Please upload CSV file');
      return;
    }

    const reader = new FileReader();
    reader.onload = function(e) {
      const lines = e.target.result.split('\n');
      let students = {};

      for (let i = 1; i < lines.length; i++) {
        const data = lines[i].split(',');
        if (data.length >= 2) {
          students[data[0].trim()] = data[1].trim();
        }
      }

      let absentees = absentRolls.filter(r => students[r]).map(r => students[r]);
      let ods = odRolls.filter(r => students[r]).map(r => students[r]);

      let text = "GOOD MORNING\n";
      text += "Date: " + date + "\n\n";
      text += "Absentees:\n" + (absentees.join('\n') || 'None') + "\n\n";
      text += "OD Students:\n" + (ods.join('\n') || 'None');

      output.value = text;
    };

    reader.readAsText(file);
  }

  function copyText() {
    const text = document.getElementById('output');
    if (!text.value) {
      alert('Nothing to copy');
      return;
    }
    text.select();
    document.execCommand('copy');
    alert('Attendance message copied to clipboard');
  }

  function downloadText() {
    const text = document.getElementById('output').value;
    if (!text) return;

    const blob = new Blob([text], { type: 'text/plain' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'attendance_message.txt';
    a.click();
  });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'attendance_message.txt';
    a.click();
  }
</script>

</body>
</html>
